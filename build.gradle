plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/starry_skies.classtweaker")
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.is-immensely.gay/releases" }
	maven { url = "https://maven.kyrptonaught.dev" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { exclude(group: "net.fabricmc.fabric-api") }
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('compileInfiniteAudit', JavaCompile) {
	source = fileTree('tools/java') { include '**/*.java' }
	classpath = sourceSets.main.runtimeClasspath
	destinationDirectory = layout.buildDirectory.dir('classes/infinite-audit')
	dependsOn tasks.classes
}

tasks.register('auditInfiniteRegions', JavaExec) {
	group = 'verification'
	description = 'Stress checks deterministic infinite macro region generation without creating chunks.'
	dependsOn tasks.compileInfiniteAudit
	classpath = files(layout.buildDirectory.dir('classes/infinite-audit')) + sourceSets.main.runtimeClasspath
	mainClass = 'de.dafuqs.starryskies.worldgen.InfiniteRegionAudit'
	args(project.findProperty('auditCount') ?: '1000')
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name = "sapphoCompany"
			url = "https://maven.is-immensely.gay/releases"
			credentials {
				username = "dafuqs"
				password = System.getenv("MAVEN_PASS")
			}
		}
	}
}
